<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavori</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="lavori">

  <!-- I testi si cambiano in sito.js, i progetti in progetti.js. -->

  <header class="header" id="header"></header>

  <main>
    <section class="project-hero">
      <p class="label" data-reveal data-ui="lavori"></p>
      <h1 class="display" data-reveal style="margin-top:24px" data-sito="lavori.titolo"></h1>
    </section>

    <section class="section" style="padding-top:0">
      <!-- Filtri e progetti sono generati da progetti.js -->
      <div class="toolbar">
        <div class="pills" id="filtri"></div>
        <div class="pills">
          <span class="label" id="conteggio"></span>
          <button data-mode="grid" aria-pressed="true" data-ui="griglia"></button>
          <button data-mode="list" aria-pressed="false" data-ui="elenco"></button>
        </div>
      </div>
      <div class="work-grid alterna" id="griglia-lavori"></div>
    </section>
  </main>

  <section class="cta" id="contatti"></section>
  <footer class="footer" id="footer"></footer>

  <script src="sito.js"></script>
  <script src="progetti.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
